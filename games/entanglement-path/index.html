<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entanglement Path</title>
  <link rel="icon" type="image/png" sizes="128x128" href="./assets/icon-128.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101820;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: max(100vw, calc(100vh * 1200 / 760));
      height: max(100vh, calc(100vw * 760 / 1200));
      aspect-ratio: 1200 / 760;
      flex: 0 0 auto;
      touch-action: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1200" height="760" aria-label="Entanglement Path"></canvas>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
