<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阡陌交通</title>
  <link rel="icon" type="image/png" sizes="128x128" href="./assets/icon-128.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b2927;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      flex: 0 0 auto;
      touch-action: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1200" height="760" aria-label="阡陌交通：中国水墨路径拼图"></canvas>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
