<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三角日历拼图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { display:grid; place-items:center; background:#dde2e5; font-family:"Microsoft YaHei",sans-serif; }
    #game-shell { position:relative; width:min(100vw,calc(100vh * 30 / 19)); height:min(100vh,calc(100vw * 19 / 30)); box-shadow:0 28px 90px #27363d2e; }
    #puzzle-board { display:block; width:100%; height:100%; touch-action:none; outline:none; }
    #load-status { position:absolute; inset:40% 8% auto; padding:20px; background:#fff; color:#8c3428; }
  </style>
</head>
<body>
  <main id="game-shell">
    <canvas id="puzzle-board" tabindex="0" role="application" aria-label="三角日历拼图。拖动拼块，R 旋转，F 翻转，Tab 切换拼块。"></canvas>
    <p id="load-status" hidden role="alert"></p>
  </main>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
