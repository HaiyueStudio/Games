<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pad Simulator - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #14171c;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0d1015;
      touch-action: none;
    }
    #title {
      position: absolute;
      left: 24px;
      top: 20px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="title">Pad Simulator</div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
