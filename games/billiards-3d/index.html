<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Billiards - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #07110d;
    }
    #hud {
      position: absolute;
      inset: 18px 22px auto 22px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    #title { font-size: 34px; font-weight: 800; }
    #help {
      margin-top: 7px;
      max-width: 470px;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(248,250,252,0.74);
      font-weight: 700;
    }
    #panel { display: flex; gap: 10px; }
    .box {
      min-width: 116px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      background: rgba(6, 12, 18, 0.72);
      box-shadow: 0 12px 30px rgba(0,0,0,0.24);
    }
    .label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #score, #state { font-size: 24px; font-weight: 800; line-height: 1; }
    #power-wrap {
      position: absolute;
      left: 22px;
      bottom: 24px;
      width: 180px;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.16);
      display: none;
      pointer-events: none;
    }
    #power {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
    }
    #controls {
      position: absolute;
      right: 22px;
      bottom: 20px;
      pointer-events: all;
    }
    button {
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="hud">
      <div>
        <div id="title">3D Billiards</div>
        <div id="help">Orbit around the cue ball to aim. Click the cue ball, drag downward to set power, release to shoot.</div>
      </div>
      <div id="panel">
        <div class="box"><span class="label">Potted</span><div id="score">0 / 10</div></div>
        <div class="box"><span class="label">State</span><div id="state">Ready</div></div>
      </div>
    </div>
    <div id="power-wrap"><div id="power"></div></div>
    <div id="controls"><button id="btn-new">New Game</button></div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
