<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02030c" />
  <title>Pac-Man — Haiyue WebGPU</title>
  <style>
    :root {
      color-scheme: dark;
      --yellow: #ffd916;
      --blue: #195cff;
      --panel: rgba(3, 7, 25, 0.78);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, #0a1034 0, #030617 44%, #010208 82%),
        #010208;
      color: #f8faff;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    #cabinet {
      position: relative;
      width: min(calc(100vw - 20px), calc((100vh - 20px) * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(69, 112, 255, 0.42);
      border-radius: 18px;
      background: #01030d;
      box-shadow:
        0 34px 100px rgba(0, 0, 0, 0.72),
        0 0 48px rgba(24, 80, 255, 0.13),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }

    body.ready canvas { opacity: 1; }

    #overlay,
    #scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #scanlines {
      z-index: 3;
      opacity: 0.17;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.045) 0,
        rgba(255, 255, 255, 0.045) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: soft-light;
    }

    #overlay { z-index: 4; }

    #brand {
      position: absolute;
      top: 4.1%;
      left: 3.4%;
      width: 16%;
    }

    #logo {
      color: var(--yellow);
      font-size: clamp(20px, 3.2vw, 48px);
      font-weight: 1000;
      line-height: 0.85;
      letter-spacing: -0.075em;
      text-shadow: 0 0 16px rgba(255, 218, 22, 0.42), 3px 4px 0 #9a2707;
      transform: skew(-5deg);
      white-space: nowrap;
    }

    #engine-label {
      margin-top: 10px;
      color: rgba(173, 193, 255, 0.68);
      font: 700 clamp(7px, 0.78vw, 12px)/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .stats {
      position: absolute;
      display: grid;
      gap: 10px;
      width: 15.5%;
      font-variant-numeric: tabular-nums;
    }

    #left-stats {
      left: 3.5%;
      top: 29%;
    }

    #right-stats {
      right: 3.5%;
      top: 7%;
    }

    .stat {
      padding: 9px 11px 8px;
      border: 1px solid rgba(74, 112, 255, 0.22);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(7, 15, 49, 0.84), rgba(1, 4, 17, 0.72));
      box-shadow: inset 0 0 18px rgba(26, 75, 255, 0.07);
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: #668afc;
      font: 800 clamp(7px, 0.7vw, 11px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      color: #fff;
      font: 900 clamp(12px, 1.45vw, 22px)/1.05 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.18);
    }

    #score { color: var(--yellow); }
    #high-score { color: #ff789e; }

    #lives-panel {
      position: absolute;
      left: 3.5%;
      bottom: 16%;
      width: 15.5%;
    }

    #lives {
      display: flex;
      gap: 7px;
      min-height: 22px;
      margin-top: 8px;
    }

    .life {
      width: clamp(13px, 1.65vw, 24px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(from 34deg, transparent 0 68deg, var(--yellow) 69deg 360deg);
      filter: drop-shadow(0 0 5px rgba(255, 217, 22, 0.4));
    }

    #status {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      min-width: 270px;
      padding: 20px 28px 18px;
      border: 1px solid rgba(70, 108, 255, 0.36);
      border-radius: 12px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translate(-50%, -47%) scale(0.96);
      background: rgba(1, 4, 18, 0.91);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.58), inset 0 0 24px rgba(30, 77, 255, 0.08);
      text-align: center;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    #status.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #status-title {
      color: var(--yellow);
      font: 1000 clamp(24px, 3vw, 46px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
      text-shadow: 0 0 18px rgba(255, 217, 22, 0.44);
    }

    #status-detail {
      color: rgba(220, 228, 255, 0.72);
      font: 700 clamp(9px, 0.9vw, 13px)/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #actions {
      position: absolute;
      left: 3.5%;
      bottom: 4.6%;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .action {
      min-height: 31px;
      padding: 0 10px;
      border: 1px solid rgba(95, 130, 255, 0.34);
      border-radius: 7px;
      background: rgba(8, 17, 54, 0.82);
      color: rgba(226, 233, 255, 0.86);
      font: 800 clamp(8px, 0.72vw, 11px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
      transition: 100ms ease;
    }

    .action:hover,
    .action:focus-visible {
      border-color: rgba(255, 216, 22, 0.7);
      color: #fff;
      outline: none;
      transform: translateY(-1px);
    }

    #help {
      position: absolute;
      right: 3.6%;
      bottom: 5%;
      width: 15%;
      color: rgba(171, 187, 237, 0.56);
      font: 700 clamp(7px, 0.72vw, 11px)/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.02em;
      text-align: right;
    }

    #dpad {
      position: absolute;
      right: 3.8%;
      bottom: 17%;
      display: none;
      grid-template: repeat(3, 42px) / repeat(3, 42px);
      pointer-events: auto;
    }

    .direction {
      border: 1px solid rgba(89, 124, 255, 0.4);
      border-radius: 10px;
      background: rgba(7, 16, 50, 0.88);
      color: #dce5ff;
      font-size: 18px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .direction:active { background: rgba(33, 74, 207, 0.92); transform: scale(0.94); }
    .direction[data-direction="up"] { grid-area: 1 / 2; }
    .direction[data-direction="left"] { grid-area: 2 / 1; }
    .direction[data-direction="right"] { grid-area: 2 / 3; }
    .direction[data-direction="down"] { grid-area: 3 / 2; }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background: #01030d;
      color: #668afc;
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em;
      transition: opacity 200ms ease, visibility 200ms ease;
    }

    #loading::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      margin-top: -62px;
      border-radius: 50%;
      background: conic-gradient(from 35deg, transparent 0 70deg, var(--yellow) 72deg 360deg);
      animation: spin 650ms linear infinite;
    }

    body.ready #loading,
    body.failed #loading { opacity: 0; visibility: hidden; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (pointer: coarse), (max-width: 760px) {
      #dpad { display: grid; }
      #help { display: none; }
      #actions { bottom: 3.5%; }
      #brand { left: 2.5%; top: 3%; }
      #left-stats { left: 2.5%; }
      #right-stats { right: 2.5%; }
      #lives-panel { left: 2.5%; }
      .stats, #lives-panel { width: 17%; }
    }

    @media (max-aspect-ratio: 1 / 1) {
      body { align-items: center; }
      #cabinet { width: calc(100vw - 12px); }
      #status { min-width: 210px; padding: 14px 18px; }
      .stat { padding: 5px 6px; border-radius: 5px; }
      #left-stats, #right-stats { gap: 5px; }
      #dpad { transform: scale(0.72); transform-origin: bottom right; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main id="cabinet">
    <canvas id="canvas" width="1280" height="720" aria-label="3D Pac-Man maze"></canvas>
    <div id="scanlines"></div>
    <div id="overlay">
      <header id="brand">
        <div id="logo">PAC-MAN</div>
        <div id="engine-label">Haiyue WebGPU arcade</div>
      </header>

      <section class="stats" id="left-stats" aria-label="Score">
        <div class="stat">
          <span class="stat-label">1UP score</span>
          <strong class="stat-value" id="score">000000</strong>
        </div>
        <div class="stat">
          <span class="stat-label">High score</span>
          <strong class="stat-value" id="high-score">000000</strong>
        </div>
      </section>

      <section class="stats" id="right-stats" aria-label="Game progress">
        <div class="stat">
          <span class="stat-label">Level</span>
          <strong class="stat-value" id="level">01</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Dots left</span>
          <strong class="stat-value" id="pellets">204</strong>
        </div>
      </section>

      <section id="lives-panel" aria-label="Lives">
        <span class="stat-label">Lives</span>
        <div id="lives"></div>
      </section>

      <div id="status" class="visible" role="status" aria-live="polite">
        <strong id="status-title">LOADING</strong>
        <span id="status-detail">Preparing WebGPU maze…</span>
      </div>

      <div id="actions">
        <button class="action" id="new-game" type="button">New game</button>
        <button class="action" id="pause" type="button">Pause</button>
        <button class="action" id="sound" type="button" aria-pressed="false">Sound on</button>
      </div>

      <div id="help">
        ARROWS / WASD — MOVE<br />
        P / ESC — PAUSE<br />
        M — SOUND &nbsp; R — RESTART<br />
        SWIPE ON THE MAZE
      </div>

      <div id="dpad" aria-label="Touch controls">
        <button class="direction" type="button" data-direction="up" aria-label="Move up">▲</button>
        <button class="direction" type="button" data-direction="left" aria-label="Move left">◀</button>
        <button class="direction" type="button" data-direction="right" aria-label="Move right">▶</button>
        <button class="direction" type="button" data-direction="down" aria-label="Move down">▼</button>
      </div>
    </div>
    <div id="loading">INITIALIZING WEBGPU</div>
  </main>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
