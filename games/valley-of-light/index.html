<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eee7">
  <title>谷外之光 · Beyond the Valley</title>
  <style>
    * { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e9eee7; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #boot { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; color: #35565a; font: 16px/2.3 "Microsoft YaHei", sans-serif; letter-spacing: .12em; pointer-events: none; }
    #boot[hidden] { display: none; } #boot strong { font-size: 34px; font-weight: 400; } #result { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="谷外之光：拖拽金色桥转动，拖拽青色桥平移，点击道路行走。Q/E 转动，A/D 平移，空格启程，R 重开，J 手记，H 提示。"></canvas>
  <div id="boot"><strong>谷外之光</strong><span>正在点亮山谷里的第一盏灯…</span></div>
  <pre id="result"></pre>
  <script src="bundle.js"></script>
</body>
</html>
