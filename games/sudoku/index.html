<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f3efe7;
      color: #243447;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap {
      position: relative;
      width: 900px;
      height: 600px;
    }
    canvas {
      display: block;
      width: 900px;
      height: 600px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" data-sudoku-game width="900" height="600"></canvas>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
