<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f3efe7;
      color: #243447;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap {
      position: relative;
      /* Match the orthographic scene's 900 × 600 design without stretching it. */
      width: min(100vw, 150vh);
      width: min(100vw, 150dvh);
      aspect-ratio: 3 / 2;
      flex: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" data-sudoku-game width="900" height="600"></canvas>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
