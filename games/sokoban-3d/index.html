<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sokoban 3D - WebGPU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #101418;
      color: #eef3f7;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      pointer-events: none;
    }
    #panel,
    #buttons {
      pointer-events: auto;
      border: 1px solid rgba(222, 232, 240, 0.16);
      border-radius: 8px;
      background: rgba(16, 20, 24, 0.76);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }
    #panel {
      min-width: 260px;
      padding: 13px 15px;
    }
    #title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
    }
    #stats {
      display: grid;
      grid-template-columns: auto auto;
      gap: 7px 18px;
      color: rgba(238, 243, 247, 0.78);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    #stats strong { color: #fff; }
    #buttons {
      display: flex;
      gap: 8px;
      padding: 9px;
    }
    button {
      height: 34px;
      border: 1px solid rgba(222, 232, 240, 0.18);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      padding: 0 13px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.18); }
    #message {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(16, 20, 24, 0.78);
      border: 1px solid rgba(222, 232, 240, 0.14);
      color: rgba(238, 243, 247, 0.82);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div id="hud">
    <div id="panel">
      <div id="title">Sokoban 3D</div>
      <div id="stats">
        <span>Level</span><strong id="level">1</strong>
        <span>Moves</span><strong id="moves">0</strong>
        <span>Boxes</span><strong id="boxes">0 / 0</strong>
      </div>
    </div>
    <div id="buttons">
      <button id="prev">Prev</button>
      <button id="restart">Restart</button>
      <button id="undo">Undo</button>
      <button id="next">Next</button>
    </div>
  </div>
  <div id="message">Arrow keys / WASD move. Z undo. R restart. Orbit with mouse.</div>
  <script type="module" src="./bundle.js?v=sokoban-3d-difficulty-v3"></script>
</body>
</html>
