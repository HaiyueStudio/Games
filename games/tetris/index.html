<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #e5e7eb;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }
    #title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0;
      color: #f8fafc;
    }
    #help {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(226, 232, 240, 0.72);
      font-weight: 700;
    }
    #panel {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }
    .box {
      min-width: 104px;
      padding: 11px 13px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }
    .label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #score {
      color: #f8fafc;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    #next {
      width: 76px;
      height: 76px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 3px;
    }
    .next-cell {
      border-radius: 3px;
      background: rgba(51, 65, 85, 0.52);
    }
    .next-cell.filled {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }
    #status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      min-width: 270px;
      padding: 26px 34px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 24px 70px rgba(0,0,0,0.42);
      text-align: center;
    }
    #status.visible { display: block; }
    #status-title {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #f8fafc;
    }
    #status-sub {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 700;
    }
    #controls {
      position: absolute;
      right: 22px;
      bottom: 20px;
      display: flex;
      gap: 10px;
      pointer-events: all;
    }
    #controls button {
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    #controls button:hover { background: #3b82f6; }
    #controls button:disabled {
      cursor: not-allowed;
      background: #475569;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="overlay">
      <div id="hud">
        <div>
          <div id="title">Tetris</div>
          <div id="help">Arrow keys / WASD move. Up/W rotate. Space hard drop. P pause.</div>
        </div>
        <div id="panel">
          <div class="box">
            <span class="label">Score</span>
            <span id="score">0</span>
          </div>
          <div class="box">
            <span class="label">Next</span>
            <div id="next"></div>
          </div>
        </div>
      </div>
      <div id="status">
        <div id="status-title"></div>
        <div id="status-sub"></div>
      </div>
    </div>
    <div id="controls">
      <button id="btn-pause">Pause</button>
      <button id="btn-new">New Game</button>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
