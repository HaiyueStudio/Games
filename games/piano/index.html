<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101418;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrap {
      position: relative;
      width: 900px;
      height: 600px;
    }
    canvas {
      display: block;
      width: 900px;
      height: 600px;
      border-radius: 8px;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    #title {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
    }
    #sub {
      margin-top: 8px;
      color: rgba(226, 232, 240, 0.72);
      font-size: 14px;
      font-weight: 700;
    }
    #status {
      min-width: 210px;
      padding: 11px 14px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 14px 35px rgba(0,0,0,0.25);
      text-align: right;
      font-weight: 800;
      color: #cbd5e1;
    }
    #note {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      min-width: 150px;
      padding: 10px 18px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #f8fafc;
    }
    #library {
      position: absolute;
      top: 86px;
      right: 24px;
      width: 310px;
      padding: 11px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 7px;
      background: rgba(8, 14, 22, 0.88);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.32);
      pointer-events: auto;
    }
    #library-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #score-list {
      width: 100%;
      height: 52px;
      padding: 3px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 4px;
      outline: 0;
      background: #111827;
      color: #e2e8f0;
      font-size: 10px;
    }
    #score-list:focus { border-color: #60a5fa; }
    #score-list option { padding: 3px 5px; }
    #transport {
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }
    #transport button {
      min-width: 54px;
      padding: 6px 8px;
      border: 1px solid rgba(96, 165, 250, 0.42);
      border-radius: 4px;
      background: rgba(37, 99, 235, 0.24);
      color: #eff6ff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
    }
    #transport button:hover:not(:disabled) { background: rgba(37, 99, 235, 0.45); }
    #transport button:disabled { cursor: default; opacity: 0.42; }
    #playback-status {
      min-width: 0;
      overflow: hidden;
      color: #cbd5e1;
      font-size: 9px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #playback-progress {
      width: 100%;
      height: 4px;
      margin-top: 6px;
      display: block;
      accent-color: #60a5fa;
    }
    #score-source {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: #93c5fd;
      font-size: 8px;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #score-source:hover { color: #dbeafe; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div id="overlay">
      <div id="hud">
        <div>
          <div id="title">Piano</div>
          <div id="sub">88 keys built from WebGPU cubes. Click a key to play.</div>
        </div>
        <div id="status">Preparing Web Audio...</div>
      </div>
      <section id="library" aria-label="Public-domain MIDI scores">
        <div id="library-title"><span>Public-domain MIDI</span><span>03 scores</span></div>
        <select id="score-list" size="3" aria-label="Choose a MIDI score" disabled>
          <option>Loading score list…</option>
        </select>
        <div id="transport">
          <button id="auto-play" type="button" disabled>Auto play</button>
          <button id="auto-stop" type="button" disabled>Stop</button>
          <span id="playback-status" aria-live="polite">Loading…</span>
        </div>
        <progress id="playback-progress" max="1" value="0" aria-label="Playback progress"></progress>
        <a id="score-source" href="https://www.mutopiaproject.org/" target="_blank" rel="noreferrer">Mutopia Project</a>
      </section>
      <div id="note">A0 - C8</div>
    </div>
  </div>
  <script type="module" src="./bundle.js?v=piano-midi-library-v3"></script>
</body>
</html>
