<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#091321" />
    <title>前线训练场 · HaiyueStudio</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #091321;
      }
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #status {
        position: fixed;
        inset: 20%;
        color: white;
        font: 16px sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="前线训练场：摇杆移动，按住射击"></canvas>
    <pre id="result" hidden></pre>
    <p id="status">正在加载角色与 AK47…</p>
    <script src="bundle.js"></script>
  </body>
</html>
