<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历拼图 - Calendar Puzzle</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef6f1;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 5 / 3));
      height: min(100vh, calc(100vw * 3 / 5));
      aspect-ratio: 5 / 3;
      touch-action: none;
      cursor: default;
      background: #eef6f1;
    }
  </style>
</head>
<body>
  <canvas id="canvas" data-calendar-puzzle-game width="1200" height="720" aria-label="日历拼图游戏"></canvas>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
