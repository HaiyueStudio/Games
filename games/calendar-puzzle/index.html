<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Puzzle</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef6f1;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: default;
      background: #eef6f1;
    }
  </style>
</head>
<body>
  <canvas id="canvas" data-calendar-puzzle-game width="1200" height="720" aria-label="Calendar Puzzle game"></canvas>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
