<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#02040d" />
    <title>Sky Strike · HaiyueStudio Games</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #010208; }
      body { display: grid; place-items: center; color: #eff9ff; }
      button { font: inherit; }
      #game-shell {
        position: relative;
        width: min(100vw, 50dvh);
        height: 100dvh;
        min-height: 320px;
        overflow: hidden;
        isolation: isolate;
        background: #030617;
        box-shadow: 0 0 90px rgba(38, 106, 191, 0.2), 0 0 0 1px rgba(124, 201, 255, 0.14);
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #engine-canvas { z-index: 0; }
      #game-canvas { z-index: 1; touch-action: none; cursor: crosshair; }
      #ui { position: absolute; z-index: 2; inset: 0; pointer-events: none; }
      #top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 0; }
      .brand { display: grid; gap: 2px; text-shadow: 0 0 18px rgba(79, 222, 255, 0.5); }
      .brand strong { color: #f4fbff; font-size: clamp(15px, 2.5dvh, 22px); font-style: italic; letter-spacing: 0.13em; line-height: 1; }
      .brand span { color: #54e8ff; font-size: 8px; font-weight: 800; letter-spacing: 0.28em; }
      .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 9px 14px; text-align: right; }
      .stat { display: grid; gap: 2px; }
      .stat-label { color: rgba(185, 213, 231, 0.62); font-size: 7px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
      .stat-value { color: #fff; font: 800 13px/1 ui-monospace, monospace; text-shadow: 0 0 12px rgba(82, 225, 255, 0.45); }
      #lives { color: #56eaff; letter-spacing: 0.18em; }
      #boss-hud { position: absolute; top: 76px; left: 18px; right: 18px; display: none; }
      #boss-hud.visible { display: block; }
      #boss-label { display: flex; justify-content: space-between; margin-bottom: 5px; color: #ff869d; font-size: 8px; font-weight: 900; letter-spacing: 0.17em; }
      #boss-track { height: 5px; overflow: hidden; border: 1px solid rgba(255, 76, 111, 0.55); background: rgba(64, 5, 21, 0.75); }
      #boss-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff244f, #ff7890); box-shadow: 0 0 15px #ff244f; transition: width 120ms linear; }
      #controls-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 78px); color: rgba(177, 210, 227, 0.68); font-size: 8px; font-weight: 700; letter-spacing: 0.08em; text-align: center; text-shadow: 0 1px 8px #000; }
      #pause-button { position: absolute; right: 12px; bottom: 11px; width: 50px; height: 29px; pointer-events: auto; border: 1px solid rgba(94, 226, 255, 0.24); background: rgba(4, 16, 34, 0.62); color: rgba(219, 244, 255, 0.8); font-size: 9px; font-weight: 800; cursor: pointer; backdrop-filter: blur(8px); }
      #pause-button:disabled { opacity: 0.35; }
      #status { position: absolute; inset: 0; display: none; place-items: center; padding: 28px; pointer-events: auto; background: radial-gradient(circle at center, rgba(7, 19, 45, 0.55), rgba(1, 3, 11, 0.78)); backdrop-filter: blur(3px); }
      #status.visible { display: grid; }
      .status-card { width: 100%; padding: 28px 20px; border: 1px solid rgba(88, 225, 255, 0.3); background: linear-gradient(160deg, rgba(5, 23, 49, 0.9), rgba(8, 10, 29, 0.94)); box-shadow: 0 22px 70px rgba(0, 0, 0, 0.48), inset 0 0 35px rgba(52, 177, 255, 0.05); text-align: center; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
      #status-title { margin: 0; font-size: clamp(28px, 5dvh, 48px); font-style: italic; letter-spacing: 0.08em; text-shadow: 0 0 24px rgba(77, 230, 255, 0.5); }
      #status-copy { max-width: 290px; margin: 13px auto 22px; color: #a9c5d7; font-size: 11px; line-height: 1.7; }
      .action-button { min-width: 150px; padding: 12px 18px; border: 1px solid #67e9ff; background: linear-gradient(135deg, #0f8fb3, #1763b5); color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 0.13em; cursor: pointer; box-shadow: 0 0 24px rgba(70, 216, 255, 0.28); }
      #fatal { position: absolute; z-index: 5; inset: 0; display: none; place-items: center; padding: 30px; background: #09030a; color: #ff9cab; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; }
      #fatal.visible { display: grid; }
      @media (max-width: 420px) {
        #top-bar { padding: 14px 12px 0; }
        #boss-hud { top: 67px; left: 12px; right: 12px; }
        .stats { gap: 7px 10px; }
      }
      @media (prefers-reduced-motion: reduce) { #boss-fill { transition: none; } }
    </style>
  </head>
  <body>
    <main id="game-shell" aria-label="Sky Strike 纵版弹幕射击游戏">
      <canvas id="engine-canvas" aria-hidden="true"></canvas>
      <canvas id="game-canvas" width="480" height="960" aria-label="游戏战场"></canvas>
      <section id="ui" aria-label="游戏界面">
        <header id="top-bar">
          <div class="brand"><strong>SKY STRIKE</strong><span>ORBITAL DEFENSE</span></div>
          <div class="stats">
            <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
            <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
            <div class="stat"><span class="stat-label">Wave</span><span class="stat-value" id="wave">01</span></div>
            <div class="stat"><span class="stat-label">Armor</span><span class="stat-value" id="lives">◆◆◆</span></div>
          </div>
        </header>
        <div id="boss-hud">
          <div id="boss-label"><span>DREADNOUGHT</span><span>THREAT Ω</span></div>
          <div id="boss-track"><div id="boss-fill"></div></div>
        </div>
        <div id="controls-hint">WASD / 方向键移动 · J 射击 · 按住并拖动屏幕</div>
        <button id="pause-button" type="button">暂停</button>
        <div id="status" class="visible">
          <div class="status-card">
            <h1 id="status-title">SKY STRIKE</h1>
            <p id="status-copy">移动：WASD / 方向键　射击：J / 按住屏幕</p>
            <button class="action-button" id="start-button" type="button">开始出击</button>
            <button class="action-button" id="restart-button" type="button" hidden>再次出击</button>
          </div>
        </div>
      </section>
      <div id="fatal" role="alert"></div>
    </main>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
