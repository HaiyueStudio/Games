<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icosahedron Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #07090d;
      color: #eef4ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 6px;
      background: rgba(6,10,18,0.78);
    }
    #hud span {
      color: rgba(238,244,255,0.84);
      font-size: 13px;
      white-space: nowrap;
    }
    #restart {
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 5px;
      background: rgba(255,255,255,0.08);
      color: #eef4ff;
      padding: 5px 10px;
      font-family: inherit;
      cursor: pointer;
    }
    #restart:hover { background: rgba(255,255,255,0.14); }
    #message {
      position: absolute;
      top: 64px;
      left: 14px;
      min-width: 260px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      background: rgba(6,10,18,0.72);
      color: rgba(238,244,255,0.72);
      font-size: 12px;
      line-height: 1.6;
    }
    #labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .label {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
    }
    .label.number {
      min-width: 20px;
      height: 20px;
      background: rgba(3,7,18,0.76);
      border: 1px solid rgba(255,255,255,0.16);
      text-shadow: none;
    }
    .label.number[data-number="1"] { color: #72a7ff; }
    .label.number[data-number="2"] { color: #54d987; }
    .label.number[data-number="3"] { color: #ff766c; }
    .label.number[data-number="4"] { color: #ad8cff; }
    .label.number[data-number="5"] { color: #ffb45e; }
    .label.number[data-number="6"] { color: #54dfd4; }
    .label.number:not([data-number="1"]):not([data-number="2"]):not([data-number="3"]):not([data-number="4"]):not([data-number="5"]):not([data-number="6"]) { color: #f8fafc; }
    .flag { color: #ff6b6b; }
    .wrong-flag { color: #f8fafc; background: rgba(239,68,68,0.88); }
    .mine { color: #111827; background: rgba(255,90,90,0.9); }
  </style>
</head>
<body>
  <canvas id="canvas" width="960" height="640"></canvas>
  <div id="hud">
    <span>Mines: <strong id="mines">0</strong></span>
    <span>Flags: <strong id="flags">0</strong></span>
    <span>Open: <strong id="open">0</strong>/<strong id="total">0</strong></span>
    <button id="restart">Restart</button>
  </div>
  <div id="message">Left click opens a cell. Right click toggles a flag or opens neighbors from a revealed number. Drag to orbit, wheel to zoom.</div>
  <div id="labels"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
