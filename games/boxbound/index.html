<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#edf0df" />
    <title>盒中漫游 · BOXBOUND</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="canvas" aria-label="盒中漫游三维游戏场景"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="brand">
      <span class="brand-symbol">▧</span
      ><span>盒中漫游 <small>BOXBOUND</small></span>
    </div>
    <div class="engine-badge"><span></span> MADE WITH HAIYUE</div>
    <main id="home">
      <div class="eyebrow">A LITTLE WORLD WITHIN A WORLD</div>
      <h1>小盒子，<br />大<span>世界。</span></h1>
      <p class="intro">
        推开一个盒子，走进另一个世界。<br />和小方一起，把每一份小小的心意放回原处。
      </p>
      <div class="home-actions">
        <button id="new" class="primary">新游戏 <span>↗</span></button
        ><button id="continue">继续游戏 <span>→</span></button>
        <div class="minor-actions">
          <button id="help">游戏说明</button><span>·</span
          ><button id="exit">退出</button>
        </div>
      </div>
      <div class="save-heading">
        <span>你的五段旅程</span><span id="slot-summary">选择存档</span>
      </div>
      <div
        id="slots"
        class="slots"
        role="group"
        aria-label="五个独立存档"
      ></div>
      <p class="home-note">116 个小世界 · Parabox 八章致敬馆</p>
    </main>
    <section id="hud" hidden>
      <header class="game-header">
        <div class="breadcrumb" id="breadcrumb">口袋群岛</div>
        <div class="toolbar">
          <span id="save-status">通关后自动保存</span
          ><button id="sound" aria-label="切换音效" aria-pressed="true">音效 开</button
          ><button id="help-game" title="游戏说明">?</button
          ><button id="home-button">首页 ↗</button>
        </div>
      </header>
      <aside class="level-card">
        <div class="eyebrow" id="chapter">THE POCKET ISLANDS</div>
        <h2 id="room-name">口袋群岛</h2>
        <p id="hint"></p>
        <div class="legend">
          <span><i id="goal-key" class="blue"></i><span id="crate-legend">同色箱 → 同色框</span></span
          ><span><i class="face-icon">☺</i>你的终点</span>
        </div>
        <div class="stats">
          <div><b id="completed">00 / 116</b><small>收集的小世界</small></div>
          <div><b id="moves">0</b><small>探索的脚步</small></div>
        </div>
        <div class="progress"><div id="progress-bar"></div></div>
      </aside>
      <div class="bottom-area">
        <div id="toast" role="status" aria-live="polite"></div>
        <div class="controls">
          <span><kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> 移动</span
          ><button id="jump"><kbd>J</kbd> 跳跃</button
          ><button id="dive"><kbd>K</kbd> 下钻</button
          ><button id="undo"><kbd>Z</kbd> 撤销</button
          ><button id="leave"><kbd>E / Esc</kbd> 外层</button
          ><button id="reset"><kbd>R</kbd> 重来</button>
        </div>
      </div>
      <div class="touch-pad">
        <button data-dir="w" aria-label="向前">↑</button>
        <div>
          <button data-dir="a" aria-label="向左">←</button
          ><button data-dir="s" aria-label="向后">↓</button
          ><button data-dir="d" aria-label="向右">→</button>
        </div>
      </div>
      <div class="compass">N ↑ <span>格点方向</span></div>
    </section>
    <dialog id="dialog">
      <button class="close" id="close-dialog" aria-label="关闭">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <div id="loading">
      <div class="loading-cube">▧</div>
      <span>正在打开小世界…</span>
    </div>
    <pre id="result" hidden></pre>
    <script src="./bundle.js"></script>
  </body>
</html>
