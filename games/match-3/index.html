<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晶核消消乐 - Haiyue Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #f8fbff;
      background:
        radial-gradient(circle at 50% 34%, rgba(42, 86, 175, 0.24), transparent 48%),
        #050817;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas[data-dragging="true"] { cursor: grabbing; }
    #hud {
      position: fixed;
      inset: 16px 16px auto 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .glass {
      border: 1px solid rgba(163, 197, 255, 0.19);
      background: linear-gradient(145deg, rgba(12, 20, 47, 0.86), rgba(6, 11, 27, 0.72));
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.34), inset 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
    }
    #panel {
      min-width: 270px;
      padding: 15px 17px;
      border-radius: 16px;
    }
    #eyebrow {
      margin-bottom: 3px;
      color: #77baff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    #stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(62px, 1fr));
      gap: 8px;
      margin-top: 13px;
    }
    .stat {
      padding: 8px 10px;
      border-radius: 10px;
      color: rgba(223, 235, 255, 0.58);
      background: rgba(99, 142, 220, 0.08);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stat strong {
      display: block;
      margin-top: 3px;
      color: #fff;
      font-size: 19px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    #actions {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px;
      border-radius: 14px;
      pointer-events: auto;
    }
    #roadmap {
      padding: 0 8px;
      color: rgba(211, 227, 255, 0.54);
      font-size: 11px;
      white-space: nowrap;
    }
    button {
      height: 38px;
      padding: 0 15px;
      border: 1px solid rgba(151, 194, 255, 0.22);
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(180deg, rgba(76, 137, 236, 0.34), rgba(44, 91, 183, 0.2));
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: linear-gradient(180deg, rgba(92, 153, 255, 0.5), rgba(44, 91, 183, 0.3)); }
    button:active { transform: translateY(1px); }
    #message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      max-width: calc(100vw - 32px);
      padding: 11px 18px;
      border-radius: 999px;
      color: rgba(235, 243, 255, 0.86);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #result { display: none; }
    @media (max-width: 620px) {
      #hud { inset: 10px 10px auto 10px; }
      #panel { min-width: 0; padding: 12px; }
      #eyebrow, #roadmap { display: none; }
      h1 { font-size: 18px; }
      #stats { margin-top: 9px; gap: 5px; }
      .stat { padding: 6px 7px; }
      .stat strong { font-size: 16px; }
      #actions { padding: 6px; }
      button { height: 34px; padding: 0 11px; }
      #message { bottom: 14px; }
    }
  </style>
</head>
<body data-render-status="pending" data-phase="idle">
  <canvas id="canvas" width="1280" height="720" aria-label="晶核消消乐棋盘"></canvas>
  <div id="hud">
    <section id="panel" class="glass" aria-label="游戏状态">
      <div id="eyebrow">Haiyue Engine · WebGPU</div>
      <h1>晶核消消乐</h1>
      <div id="stats">
        <div class="stat">分数<strong id="score">0</strong></div>
        <div class="stat">步数<strong id="moves">0</strong></div>
        <div class="stat">连锁<strong id="cascade">—</strong></div>
      </div>
    </section>
    <div id="actions" class="glass">
      <span id="roadmap">球形炸弹 · 彩色方块 · 环形超级炸弹</span>
      <button id="restart" type="button">重新开始</button>
    </div>
  </div>
  <div id="message" class="glass">点击相邻方块，或按住滑动来交换位置</div>
  <output id="result" aria-live="polite"></output>
  <script type="module" src="./bundle.js?v=match-3-v10"></script>
</body>
</html>
