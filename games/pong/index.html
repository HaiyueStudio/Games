<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06182a" />
  <title>Pong · Haiyue Engine</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03111f; }
    body { display: grid; place-items: center; }
    .game-shell { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #071b30; isolation: isolate; }
    .game-shell::before {
      content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(circle at 50% 43%, transparent 28%, rgba(0, 7, 18, .36) 100%), linear-gradient(180deg, rgba(36, 115, 180, .18), transparent 38%);
      mix-blend-mode: multiply;
    }
    canvas { display: block; width: 100%; height: 100%; background: linear-gradient(#123f68, #071a2d); touch-action: none; }
    .scoreboard { position: absolute; z-index: 4; inset: 4.2% 4.6% auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; pointer-events: none; }
    .score { display: flex; flex-direction: column; gap: .2rem; }
    .score.right { align-items: flex-end; }
    .score small { color: rgba(230, 242, 255, .68); font-size: clamp(8px, 1vw, 13px); font-weight: 800; letter-spacing: .24em; }
    .score strong { color: #fff; font-size: clamp(44px, 8vw, 104px); line-height: .86; font-weight: 950; text-shadow: 0 0 8px #fff, 0 0 25px var(--glow), 0 0 52px var(--glow); }
    .score.left { --glow: #1d6fff; }
    .score.right { --glow: #ff3038; }
    .match-chip { display: grid; justify-items: center; gap: .45rem; padding-top: .2rem; }
    .match-chip b { color: #f6fbff; font-size: clamp(10px, 1.1vw, 14px); letter-spacing: .28em; }
    .match-chip span { min-width: 6rem; padding: .45rem .8rem; border: 1px solid rgba(255,255,255,.17); border-radius: 999px; color: rgba(239,248,255,.82); background: rgba(4,16,31,.46); backdrop-filter: blur(12px); font-size: clamp(8px, .9vw, 12px); text-align: center; }
    .bottom-hud { position: absolute; z-index: 4; left: 3.3%; right: 3.3%; bottom: 3.5%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; pointer-events: none; }
    .controls { display: flex; align-items: center; gap: .8rem; color: rgba(238,247,255,.76); font-size: clamp(9px, .9vw, 13px); font-weight: 700; }
    .controls.right { justify-content: flex-end; }
    .keys { display: flex; gap: .3rem; }
    kbd { display: grid; place-items: center; min-width: 2.1em; height: 2.1em; padding: 0 .45em; border: 1px solid rgba(255,255,255,.22); border-bottom-color: rgba(255,255,255,.42); border-radius: .45em; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.06)); box-shadow: 0 5px 14px rgba(0,0,0,.22); color: white; font: inherit; }
    .telemetry { display: flex; gap: 1.6rem; padding: .65rem 1rem; border: 1px solid rgba(255,255,255,.13); border-radius: .8rem; background: rgba(3,14,27,.58); backdrop-filter: blur(10px); }
    .telemetry div { display: grid; gap: .15rem; text-align: center; }
    .telemetry small { color: rgba(204,225,241,.54); font-size: clamp(7px, .65vw, 9px); font-weight: 800; letter-spacing: .15em; }
    .telemetry strong { color: #effaff; font-size: clamp(10px, 1vw, 14px); }
    .announcement { position: absolute; z-index: 5; left: 50%; top: 48%; transform: translate(-50%, -50%) scale(.94); opacity: 0; padding: .9rem 1.5rem; border: 1px solid rgba(255,255,255,.26); border-radius: .9rem; background: rgba(2,13,25,.64); box-shadow: 0 16px 48px rgba(0,0,0,.32), inset 0 0 28px rgba(83,174,255,.08); backdrop-filter: blur(14px); color: #fff; font-size: clamp(20px, 3vw, 42px); font-weight: 950; letter-spacing: .12em; text-align: center; pointer-events: none; transition: opacity .2s ease, transform .2s ease; white-space: nowrap; }
    .announcement[data-visible="true"] { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .actions { position: absolute; z-index: 6; top: 2.1%; left: 50%; transform: translateX(-50%); display: flex; gap: .4rem; }
    button { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: .42rem .8rem; background: rgba(4,17,31,.42); color: rgba(238,248,255,.72); font: 700 clamp(8px, .75vw, 11px)/1 inherit; cursor: pointer; backdrop-filter: blur(8px); }
    button:hover { color: #fff; border-color: rgba(255,255,255,.34); }
    #result { position: fixed; left: -10000px; top: -10000px; }
    @media (max-width: 700px) {
      .scoreboard { inset-inline: 3%; }
      .match-chip span { min-width: 4rem; }
      .bottom-hud { grid-template-columns: 1fr 1fr; }
      .telemetry { display: none; }
      .controls.right { grid-column: 2; }
    }
  </style>
</head>
<body data-render-status="starting">
  <main class="game-shell" aria-label="Haiyue Pong 双人对战">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="scoreboard" aria-live="polite">
      <div class="score left"><small>BLUE · W / S</small><strong id="left-score">0</strong></div>
      <div class="match-chip"><b>PONG</b><span id="status">正在启动</span></div>
      <div class="score right"><small>RED · ARROWS</small><strong id="right-score">0</strong></div>
    </div>
    <div class="actions">
      <button id="restart" type="button">R · 重新开始</button>
      <button id="pause" type="button">P · 暂停</button>
    </div>
    <div id="announcement" class="announcement" data-visible="true">READY</div>
    <div class="bottom-hud">
      <div class="controls"><span>左侧挡板</span><span class="keys"><kbd>W</kbd><kbd>S</kbd></span></div>
      <div class="telemetry">
        <div><small>RALLY</small><strong id="rally">00</strong></div>
        <div><small>SPEED</small><strong id="speed">0 / 760</strong></div>
      </div>
      <div class="controls right"><span class="keys"><kbd>↑</kbd><kbd>↓</kbd></span><span>右侧挡板</span></div>
    </div>
  </main>
  <pre id="result" aria-hidden="true"></pre>
  <script src="./bundle.js"></script>
</body>
</html>
