<!doctype html>
<html><head><meta charset="utf-8"><title>Game module lifecycle fixture</title><style>html,body,#host{margin:0;width:100%;height:100%;overflow:hidden}#host{position:fixed;inset:0}#result{display:none}</style></head>
<body><div id="host"></div><pre id="result"></pre><script type="module">
import {GameRouter,gameModuleUrl} from '../../../../site/game-host.js';
const router=new GameRouter(),root=document.getElementById('host'),gamesRoot=new URL('../../../',import.meta.url).href;
window.__host={router,progress:[],async mount(id,mode='screen'){
 this.progress=[];return router.mount(id,gameModuleUrl(id,gamesRoot),{root,url:new URL(id+'/index.html?verify=1',gamesRoot).href,mode,onProgress:progress=>this.progress.push(progress)});
},dispose(){router.clear();},async texture(){
 const instance=router.instance,texture=instance.texture,device=instance.engine.device,width=texture.width,height=texture.height,stride=Math.ceil(width*4/256)*256;
 const buffer=device.createBuffer({size:stride*height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),encoder=device.createCommandEncoder();
 encoder.copyTextureToBuffer({texture},{buffer,bytesPerRow:stride},[width,height]);device.queue.submit([encoder.finish()]);await buffer.mapAsync(GPUMapMode.READ);
 const bytes=new Uint8Array(buffer.getMappedRange()),colors=new Set();for(let row=0;row<height;row+=7)for(let column=0;column<width;column+=7){const offset=row*stride+column*4;colors.add(bytes[offset]+','+bytes[offset+1]+','+bytes[offset+2]);}
 buffer.unmap();buffer.destroy();return{width,height,colors:colors.size};
}};
</script></body></html>
