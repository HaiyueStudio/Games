<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05091d">
  <title>Neon Circuit · Haiyue Engine</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020512; }
    body { color: #eef9ff; }
    .game { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; background: linear-gradient(#071539, #030817); }
    .game::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at 50% 46%, transparent 35%, rgba(1, 3, 15, .48) 100%), linear-gradient(180deg, rgba(32, 128, 255, .1), transparent 42%); }
    .top { position: absolute; z-index: 5; inset: 20px 24px auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
    .brand { padding: 13px 16px; border: 1px solid rgba(87, 216, 255, .3); border-radius: 4px 16px 4px 16px; background: linear-gradient(120deg, rgba(4, 12, 34, .82), rgba(14, 8, 38, .62)); box-shadow: 0 0 32px rgba(0, 194, 255, .11), inset 0 0 22px rgba(26, 176, 255, .06); backdrop-filter: blur(10px); }
    .eyebrow { color: #55eaff; font-size: 10px; font-weight: 900; letter-spacing: .32em; }
    h1 { margin: 3px 0 0; font-size: clamp(20px, 3vw, 36px); font-weight: 950; line-height: 1; letter-spacing: .11em; text-shadow: 0 0 18px rgba(34, 213, 255, .45); }
    .stats { display: flex; overflow: hidden; margin: 0; border: 1px solid rgba(255,255,255,.15); border-radius: 4px 16px 4px 16px; background: rgba(3, 8, 27, .74); backdrop-filter: blur(10px); }
    .stats div { min-width: 88px; padding: 11px 14px; border-left: 1px solid rgba(255,255,255,.09); text-align: center; }
    .stats div:first-child { border-left: 0; }
    dt { color: rgba(207, 231, 248, .5); font-size: 9px; font-weight: 900; letter-spacing: .18em; }
    dd { margin: 4px 0 0; color: white; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .speedometer { position: absolute; z-index: 5; right: 28px; bottom: 30px; width: 174px; height: 174px; display: grid; place-items: center; border: 1px solid rgba(83, 225, 255, .32); border-radius: 50%; background: radial-gradient(circle, rgba(7, 19, 43, .9) 0 46%, rgba(5, 10, 28, .52) 47% 63%, transparent 64%); box-shadow: inset 0 0 30px rgba(19, 190, 255, .12), 0 0 35px rgba(0, 174, 255, .1); pointer-events: none; }
    .speedometer::before { content: ""; position: absolute; inset: 9px; border: 2px solid transparent; border-top-color: #54edff; border-right-color: #f522a3; border-radius: 50%; transform: rotate(22deg); }
    .speed-value { text-align: center; }
    #speed { display: block; font: 950 48px/.88 ui-monospace, monospace; letter-spacing: -.08em; text-shadow: 0 0 18px #1bcfff; }
    .speed-value small { color: rgba(210, 236, 248, .55); font-size: 9px; font-weight: 900; letter-spacing: .24em; }
    .bottom-left { position: absolute; z-index: 5; left: 24px; bottom: 24px; width: min(360px, calc(100vw - 230px)); pointer-events: none; }
    .boost-copy { display: flex; justify-content: space-between; margin-bottom: 7px; color: #6aecff; font-size: 9px; font-weight: 900; letter-spacing: .15em; }
    .boost-track { height: 8px; overflow: hidden; border: 1px solid rgba(100, 231, 255, .34); transform: skewX(-18deg); background: rgba(3, 12, 28, .72); }
    #boost-fill { width: 0; height: 100%; background: linear-gradient(90deg, #26d8ff, #e927ff); box-shadow: 0 0 18px #36dcff; transition: width .06s linear; }
    .help { margin-top: 12px; color: rgba(221, 239, 251, .62); font-size: 11px; line-height: 1.7; }
    kbd { display: inline-grid; min-width: 22px; height: 21px; margin: 0 2px; place-items: center; border: 1px solid rgba(255,255,255,.26); border-radius: 3px; background: rgba(255,255,255,.08); color: #fff; font: 800 10px inherit; }
    .actions { position: absolute; z-index: 6; top: 22px; left: 50%; display: flex; gap: 7px; transform: translateX(-50%); }
    button { border: 1px solid rgba(100, 222, 255, .24); border-radius: 3px 10px 3px 10px; padding: 8px 12px; color: rgba(235, 249, 255, .76); background: rgba(4, 12, 33, .68); font: 800 10px inherit; cursor: pointer; backdrop-filter: blur(9px); }
    button:hover { color: white; border-color: #62e9ff; }
    .announcement { position: absolute; z-index: 7; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.92); opacity: 0; padding: 15px 25px; border-top: 2px solid #58eaff; border-bottom: 2px solid #f12aa6; color: #fff; background: linear-gradient(90deg, transparent, rgba(4, 11, 34, .82) 18% 82%, transparent); font-size: clamp(34px, 7vw, 82px); font-weight: 950; letter-spacing: .12em; text-align: center; text-shadow: 0 0 22px #24cfff; pointer-events: none; transition: opacity .16s, transform .16s; white-space: nowrap; }
    .announcement[data-visible="true"] { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .touch { display: none; position: absolute; z-index: 8; inset: auto 15px 14px; justify-content: space-between; pointer-events: none; }
    .touch-group { display: grid; grid-template-columns: repeat(2, 54px); gap: 8px; pointer-events: auto; }
    .touch button { width: 54px; height: 54px; padding: 0; border-radius: 15px; font-size: 19px; user-select: none; touch-action: none; }
    #result { position: fixed; left: -10000px; top: -10000px; }
    @media (max-width: 760px), (pointer: coarse) {
      .top { inset: 10px 10px auto; }
      .brand { padding: 9px 11px; }
      .eyebrow { display: none; }
      h1 { font-size: 18px; }
      .stats div { min-width: 62px; padding: 8px 6px; }
      .stats div:last-child { display: none; }
      dd { font-size: 12px; }
      .actions { top: 62px; }
      .speedometer { width: 105px; height: 105px; right: 16px; bottom: 84px; }
      #speed { font-size: 31px; }
      .bottom-left { left: 16px; bottom: 84px; width: calc(100vw - 150px); }
      .help { display: none; }
      .touch { display: flex; }
    }
  </style>
</head>
<body data-render-status="starting" data-phase="countdown">
  <main class="game" aria-label="Neon Circuit 未来悬浮赛车">
    <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
    <header class="top">
      <div class="brand"><div class="eyebrow">HAIYUE ANTI-GRAVITY LEAGUE</div><h1>NEON CIRCUIT</h1></div>
      <dl class="stats">
        <div><dt>LAP</dt><dd id="lap">1 / 3</dd></div>
        <div><dt>TIME</dt><dd id="timer">00:00.000</dd></div>
        <div><dt>BEST</dt><dd id="best">--:--.---</dd></div>
      </dl>
    </header>
    <div class="actions">
      <button id="restart" type="button">R · 重开</button>
      <button id="pause" type="button">P · 暂停</button>
    </div>
    <div id="announcement" class="announcement" data-visible="true">3</div>
    <section class="bottom-left">
      <div class="boost-copy"><span id="boost-label">SEEK CYAN PAD</span><span>TRACK BOOST</span></div>
      <div class="boost-track"><div id="boost-fill"></div></div>
      <div class="help"><kbd>W</kbd>/<kbd>↑</kbd> 加速　<kbd>S</kbd>/<kbd>↓</kbd> 刹车　<kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> 转向<br>高速巡航并驶过青色加速带可触发超速、动态视野和强化尾焰；驶出赛道或撞上护栏会明显减速。</div>
    </section>
    <aside class="speedometer"><div class="speed-value"><span id="speed">000</span><small>KM / H</small></div></aside>
    <div class="touch" aria-label="触控驾驶">
      <div class="touch-group"><button type="button" data-control="a" aria-label="左转">◀</button><button type="button" data-control="d" aria-label="右转">▶</button></div>
      <div class="touch-group"><button type="button" data-control="s" aria-label="刹车">▼</button><button type="button" data-control="w" aria-label="加速">▲</button></div>
    </div>
  </main>
  <pre id="result" aria-hidden="true"></pre>
  <script src="./bundle.js?v=neon-circuit-hyperspeed-v2"></script>
</body>
</html>
