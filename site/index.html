<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="description" content="你的浏览器游戏空间。探索 Haiyue 游戏库，用手柄、键盘或触屏开启下一场游戏。"/>
    <meta name="theme-color" content="#101115"/>
    <title>
      Haiyue · 游戏空间
    </title>
    <link rel="stylesheet" href="./styles.css"/>
    <script type="module" src="./app.js">
    </script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-library" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="2"/>
        <rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/>
        <rect x="14" y="14" width="7" height="7" rx="2"/>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="7"/>
        <path d="m16 16 5 5"/>
      </symbol>
      <symbol id="icon-pad" viewBox="0 0 24 24">
        <path d="M7 6h10c3 0 4 4 4.5 8S20 20 17 17l-2-2H9l-2 2c-3 3-5 1-4.5-3S4 6 7 6Z"/>
        <path d="M5 10h5M7.5 7.5v5M16 10h.01M18 12h.01"/>
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6 6 6-6 6"/>
      </symbol>
      <symbol id="icon-external" viewBox="0 0 24 24">
        <path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>
      </symbol>
    </svg>
    <header class="system-bar">
      <a class="brand" href="./" aria-label="Haiyue 游戏空间首页">
        <span class="brand-mark" aria-hidden="true">
          <i>
          </i>
          <i>
          </i>
          <i>
          </i>
        </span>
        <strong>
          HAIYUE
          <span>
            PLAY SPACE
          </span>
        </strong>
      </a>
      <div class="system-context">
        <span class="status-dot">
        </span>
        游戏空间
        <span class="context-divider">
          /
        </span>
        随时开启下一场
      </div>
      <div class="system-status">
        <span id="webgpu-status" class="support-pill">
          检测浏览器
        </span>
        <time id="system-time" aria-label="当前时间">
          --:--
        </time>
        <span class="player-avatar" aria-label="本机玩家">
          P1
        </span>
      </div>
    </header>
    <div class="desktop">
      <aside class="sidebar">
        <p class="nav-caption">
          你的空间
        </p>
        <nav class="library-nav" aria-label="游戏库视图">
          <button type="button" class="nav-item active" data-view="all" aria-label="游戏库" title="游戏库" aria-pressed="true">
            <svg aria-hidden="true">
              <use href="#icon-library"/>
            </svg>
            <span>
              游戏库
            </span>
            <small id="game-count">
              —
            </small>
          </button>
          <button type="button" class="nav-item" data-view="recent" aria-label="最近游玩" title="最近游玩" aria-pressed="false">
            <svg aria-hidden="true">
              <use href="#icon-clock"/>
            </svg>
            <span>
              最近游玩
            </span>
          </button>
          <button type="button" class="nav-item" data-view="favorites" aria-label="我的收藏" title="我的收藏" aria-pressed="false">
            <svg aria-hidden="true">
              <use href="#icon-heart"/>
            </svg>
            <span>
              我的收藏
            </span>
            <small id="favorite-count">
              0
            </small>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <svg class="controller-icon" aria-hidden="true">
            <use href="#icon-pad"/>
          </svg>
          <strong>
            按下开始，进入游戏
          </strong>
          <p>
            连接手柄，或使用键盘与鼠标。
          </p>
          <a href="https://github.com/HaiyueStudio/Games" target="_blank" rel="noopener">
            关于 Haiyue
            <span aria-hidden="true">
              ↗
            </span>
          </a>
        </div>
      </aside>
      <main>
        <section class="spotlight" aria-labelledby="spotlight-title" id="spotlight">
          <img id="spotlight-image" class="spotlight-image" alt=""/>
          <div class="spotlight-shade">
          </div>
          <div class="spotlight-content">
            <p class="eyebrow">
              <span class="status-dot">
              </span>
              <span id="spotlight-kicker">
                准备就绪 · 即刻游玩
              </span>
            </p>
            <div class="spotlight-tags" id="spotlight-tags">
            </div>
            <h1 id="spotlight-title">
              你的下一场冒险
            </h1>
            <p id="spotlight-description">
              正在载入游戏库…
            </p>
            <div class="spotlight-actions">
              <button class="launch-button" id="spotlight-play" type="button" disabled>
                <span class="keycap round" aria-hidden="true">
                  A
                </span>
                开始游戏
                <svg aria-hidden="true">
                  <use href="#icon-arrow"/>
                </svg>
              </button>
              <button id="favorite-toggle" class="favorite-button" type="button" disabled aria-label="收藏当前游戏" aria-pressed="false">
                <svg aria-hidden="true">
                  <use href="#icon-heart"/>
                </svg>
              </button>
            </div>
          </div>
          <span class="spotlight-corner" aria-hidden="true">
            HAIYUE PLAY SPACE
            <span>
              ✦
            </span>
          </span>
        </section>
        <section class="collection" aria-labelledby="collection-title">
          <div class="collection-heading">
            <div class="collection-title">
              <h2 id="collection-title">
                全部游戏
              </h2>
              <span id="visible-count">
              </span>
            </div>
            <label class="search-box">
              <svg aria-hidden="true">
                <use href="#icon-search"/>
              </svg>
              <input id="game-search" type="search" aria-label="搜索游戏" placeholder="搜索游戏" autocomplete="off"/>
              <kbd aria-hidden="true">
                /
              </kbd>
            </label>
          </div>
          <div class="filter-row">
            <span class="keycap shoulder" aria-hidden="true">
              LB
            </span>
            <div class="filters" id="game-filters" aria-label="游戏分类">
            </div>
            <span class="keycap shoulder" aria-hidden="true">
              RB
            </span>
          </div>
          <div class="game-grid" id="game-grid" aria-label="游戏列表">
          </div>
          <div class="empty-state" id="empty-state" hidden>
            <svg aria-hidden="true">
              <use href="#icon-library"/>
            </svg>
            <h3 id="empty-title">
              还没有游戏
            </h3>
            <p id="empty-description">
            </p>
            <button id="empty-reset" type="button">
              浏览全部游戏
              <span aria-hidden="true">
                →
              </span>
            </button>
          </div>
          <p id="catalog-announcement" class="sr-only" role="status">
          </p>
        </section>
      </main>
    </div>
    <footer class="command-bar">
      <div class="input-hints">
        <span>
          <kbd>
            ↑↓←→
          </kbd>
          选择
        </span>
        <span>
          <kbd>
            Enter
          </kbd>
          <b class="keycap round">
            A
          </b>
          开始
        </span>
        <span>
          <kbd>
            Esc
          </kbd>
          返回
        </span>
        <span class="favorite-hint">
          <kbd>
            F
          </kbd>
          收藏
        </span>
      </div>
      <div class="footer-label" id="input-status">
        <svg aria-hidden="true">
          <use href="#icon-pad"/>
        </svg>
        手柄 / 键鼠 / 触屏
      </div>
    </footer>
    <p id="gamepad-help" class="sr-only" hidden aria-live="polite">
    </p>
    <dialog class="game-dialog" id="game-dialog">
      <div class="player-shell">
        <header class="player-header">
          <div>
            <span class="player-kicker">
              正在游玩
            </span>
            <strong id="player-title">
              游戏
            </strong>
          </div>
          <div class="player-actions">
            <a id="player-new-tab" href="./" target="_blank" rel="noopener" aria-label="在新标签页打开游戏">
              <svg aria-hidden="true">
                <use href="#icon-external"/>
              </svg>
              <span>
                独立窗口
              </span>
            </a>
            <button id="player-close" type="button">
              <span aria-hidden="true">
                ←
              </span>
              返回游戏库
              <kbd>
                Esc
              </kbd>
            </button>
          </div>
        </header>
        <div class="player-stage">
          <div class="player-loading" id="player-loading" role="status">
            正在启动游戏…
          </div>
          <iframe id="game-frame" title="游戏" src="about:blank" allow="autoplay; fullscreen; gamepad" allowfullscreen>
          </iframe>
        </div>
      </div>
    </dialog>
    <noscript>
      请启用 JavaScript 以载入游戏库。
    </noscript>
  </body>
</html>
